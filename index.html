<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Telegram → Facebook Test</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: light dark; }
    body { margin:0; padding:24px; min-height:100vh; box-sizing:border-box;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--tg-theme-bg-color,#fff); color:var(--tg-theme-text-color,#111); }
    .card { max-width:520px; margin:auto; padding:24px; border-radius:18px;
      background:var(--tg-theme-secondary-bg-color,#f2f2f2); }
    h1 { font-size:25px; margin:0 0 12px; }
    p { line-height:1.5; color:var(--tg-theme-hint-color,#666); }
    button { width:100%; border:0; border-radius:12px; padding:15px; margin-top:12px;
      font-size:16px; font-weight:600; background:var(--tg-theme-button-color,#2481cc);
      color:var(--tg-theme-button-text-color,#fff); }
    .secondary { background:transparent; color:var(--tg-theme-text-color,#111);
      border:1px solid #9995; }
    #status { margin-top:18px; font-size:13px; color:var(--tg-theme-hint-color,#777); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Telegram → Facebook Test</h1>
    <p>This is a simple Mini App test. It opens the normal Facebook website and does not automate friend requests or collect Facebook credentials/cookies.</p>
    <button id="facebook">Open Facebook</button>
    <button id="close" class="secondary">Close Mini App</button>
    <div id="status">Ready.</div>
  </main>
<script>
  const tg = window.Telegram?.WebApp;
  const status = document.getElementById('status');
  if (tg) { tg.ready(); tg.expand(); }
  document.getElementById('facebook').onclick = () => {
    status.textContent = 'Opening Facebook…';
    if (tg?.openLink) tg.openLink('https://www.facebook.com/');
    else window.open('https://www.facebook.com/', '_blank', 'noopener,noreferrer');
  };
  document.getElementById('close').onclick = () => tg?.close?.();
</script>
</body>
</html>
